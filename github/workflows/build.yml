name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip SmartBackup.zip -d .

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x SmartBackup/gradlew

    - name: Build Release APK
      run: |
        cd SmartBackup
        ./gradlew assembleRelease --no-daemon

    - name: Sign APK with debug key
      run: |
        cd SmartBackup
        # إنشاء مفتاح توقيع تلقائي
        keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=WORM, OU=GBT, O=ZEROTRACE, L=City, S=State, C=US"
        
        # البحث عن ملف الـ APK
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        
        # توقيع الملف
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore release.keystore -storepass password -keypass password "$APK_PATH" release

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: SmartBackup/app/build/outputs/apk/release/*.apk
